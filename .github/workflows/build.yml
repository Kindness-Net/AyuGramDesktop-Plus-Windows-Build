name: Windows
run-name: "Windows x64 · source run #${{ inputs.source_run_id }}.${{ inputs.source_run_attempt }} · ${{ inputs.source_sha }}"

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source commit SHA.
        required: true
        type: string
      source_ref:
        description: Source Git ref.
        required: true
        type: string
      source_run_id:
        description: Source Release workflow run ID.
        required: true
        type: string
      source_run_attempt:
        description: Source Release workflow run attempt.
        required: true
        type: string
      version:
        description: Display version from the source commit.
        required: true
        type: string
      appupdateversion:
        description: Update version from the source commit.
        required: true
        type: string

permissions:
  contents: read
  # 构建成功后清理同前缀的旧世代缓存
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ inputs.source_ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 359

    env:
      # 4 核 16 GB 的 runner，Release 不带调试信息后内存足够 3 路并发
      BUILD_JOBS: '3'
      # 传给 scripts/build_support，按行指定目标平台与工具链
      AYUGRAM_TARGET: win64
      AYUGRAM_TOOLSET_VERSION: '14.51'
      AYUGRAM_CMAKE_TOOLSET: v145
      AYUGRAM_CMAKE_GENERATOR: 'Visual Studio 18 2026'
      AYUGRAM_VCVARS_ARCH: x64
      SHORT_WORKSPACE: 'D:\w'
      CACHE_KEY_PREFIX: win-libs-x64-
      # 发布包哈希与 GitHub 发布页的 digest 一致，升级版本时两项一起改
      CCACHE_PACKAGE: ccache-4.14-windows-x86_64
      CCACHE_SHA256: 2568347a697e103ca1b073981c704ad76fb2507d066c38dba038dd73399d968f
      CCACHE_URL: https://github.com/ccache/ccache/releases/download/v4.14
      # 与依赖缓存共用仓库 10 GB 配额，两者合计须留有余量
      CCACHE_MAXSIZE: 4G
      CCACHE_KEY_PREFIX: win-ccache-x64-

    steps:
      - name: Validate dispatcher.
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTOR" = "KiritoXDone"

      - name: Enable Git long paths.
        shell: bash
        run: |
          set -euo pipefail
          git config --global core.longpaths true
          test "$(git config --global --bool core.longpaths)" = "true"

      - name: Check out repository.
        uses: actions/checkout@v7
        with:
          repository: Kindness-Kismet/AyuGramDesktop-Plus
          ref: ${{ inputs.source_sha }}
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python.
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Validate source request.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_REF: ${{ inputs.source_ref }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          VERSION: ${{ inputs.version }}
          APP_UPDATE_VERSION: ${{ inputs.appupdateversion }}
        run: |
          set -euo pipefail
          python scripts/build_provenance.py validate-source \
            --repository Kindness-Kismet/AyuGramDesktop-Plus \
            --sha "$SOURCE_SHA" \
            --ref "$SOURCE_REF" \
            --run-id "$SOURCE_RUN_ID" \
            --run-attempt "$SOURCE_RUN_ATTEMPT" \
            --version "$VERSION" \
            --appupdateversion "$APP_UPDATE_VERSION" \
            --workflow-path .github/workflows/build-release.yml

      - name: Check packer cache guard.
        shell: bash
        run: |
          set -euo pipefail
          python -c "from pathlib import Path; assert b'ccache:disable' in Path('Telegram/SourceFiles/_other/packer.cpp').read_bytes()[:4096]"

      # subst 会被 Python 和 Qt 还原成长路径，复制到物理短目录后再编译。
      - name: Create short build workspace.
        shell: cmd
        run: |
          robocopy "%GITHUB_WORKSPACE%" "%SHORT_WORKSPACE%" /MIR /XD "%GITHUB_WORKSPACE%\.git" /R:2 /W:1
          if %ERRORLEVEL% GEQ 8 exit /b %ERRORLEVEL%
          exit /b 0

      - name: Set up MSVC.
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ env.AYUGRAM_VCVARS_ARCH }}

      # 每个架构独占一个仓库，整体缓存各自享有完整的 10 GB 配额。
      - name: Restore libraries cache.
        id: cache-libs
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.SHORT_WORKSPACE }}\build\tmp\Libraries
            ${{ env.SHORT_WORKSPACE }}\build\tmp\ThirdParty
          key: ${{ env.CACHE_KEY_PREFIX }}${{ hashFiles('scripts/prebuild.py', 'scripts/trim_windows_cache.py', 'scripts/build_support/recipes.py', 'scripts/build_support/recipes_arm64.py', 'scripts/build_support/dependency_cache.py') }}
          restore-keys: ${{ env.CACHE_KEY_PREFIX }}

      # 缓存归档保不住符号链接，msys2 的 mtab 与 dev 由运行时重建
      - name: Clean broken msys2 links.
        if: steps.cache-libs.outputs.cache-matched-key != ''
        shell: bash
        working-directory: ${{ env.SHORT_WORKSPACE }}
        run: |
          set -euo pipefail
          rm -f build/tmp/ThirdParty/msys64/etc/mtab
          rm -rf build/tmp/ThirdParty/msys64/dev || true

      # 缓存命中且磁盘宽裕时跳过清理；全量依赖编译前必须清出空间
      - name: Free up disk space.
        shell: bash
        env:
          CACHE_HIT: ${{ steps.cache-libs.outputs.cache-hit }}
        run: |
          set -euo pipefail
          free_gb=$(df -BG --output=avail /d | tail -1 | tr -dc '0-9')
          echo "free space on D: ${free_gb} GiB (cache hit: ${CACHE_HIT})"
          if test "$CACHE_HIT" = "true" && test "$free_gb" -ge 60; then
            echo "cache hit with enough free space, skipping cleanup"
            exit 0
          fi
          rm -rf "/c/Program Files/dotnet" || true
          rm -rf "/c/Program Files (x86)/Android" || true
          rm -rf "/c/Program Files/Microsoft SDKs/Azure" || true
          rm -rf "/c/Program Files/Microsoft SQL Server" || true
          rm -rf "/c/Program Files (x86)/Microsoft SQL Server" || true
          rm -rf "/c/Program Files/MongoDB" || true
          rm -rf "/c/Program Files/MySQL" || true
          rm -rf "/c/Program Files/PostgreSQL" || true
          rm -rf "/c/Program Files/R" || true
          rm -rf "/c/Program Files/Amazon" || true
          rm -rf "/c/Program Files/LLVM" || true
          rm -rf "/c/Program Files (x86)/LLVM" || true
          rm -rf "/c/Program Files/nodejs" || true
          rm -rf "/c/Program Files/Microsoft Service Fabric" || true
          rm -rf "/c/Program Files/Microsoft SDKs/Service Fabric" || true
          rm -rf /c/Miniconda || true
          rm -rf /c/PostgreSQL || true
          rm -rf /c/cabal || true
          rm -rf /c/ghcup || true
          rm -rf /c/mingw64 || true
          rm -rf /c/msys64 || true
          rm -rf /c/Strawberry || true
          rm -rf /c/vcpkg || true
          rm -rf /c/hostedtoolcache/windows/go || true
          rm -rf /c/hostedtoolcache/windows/node || true
          rm -rf /c/hostedtoolcache/windows/PyPy || true
          rm -rf /c/hostedtoolcache/windows/Ruby || true
          rm -rf /c/hostedtoolcache/windows/Java_Temurin-Hotspot_jdk || true
          find /c/hostedtoolcache/windows/Python -mindepth 1 -maxdepth 1 \
            -type d ! -name 3.12.10 -exec rm -rf {} + || true
          df -h /c || true
          df -h /d || true

      - name: Build dependencies.
        id: build-dependencies
        shell: cmd
        working-directory: ${{ env.SHORT_WORKSPACE }}
        run: python scripts/prebuild.py

      # 中间产物不入库可把缓存压到 10 GB 限制内，恢复后阶段标记仍完整
      # Qt 6 的 cmake 配置引用安装目录里的 objects-*，裁掉会让 arm64 配置阶段直接失败
      - name: Trim intermediate build files.
        id: trim-dependencies
        shell: cmd
        working-directory: ${{ env.SHORT_WORKSPACE }}
        run: python scripts/trim_windows_cache.py build/tmp/Libraries build/tmp/ThirdParty

      # 只有 prebuild 和裁剪都成功才入库；后续应用编译失败不影响这份已验证缓存。
      - name: Save libraries cache.
        id: save-libs
        if: >-
          steps.build-dependencies.outcome == 'success'
            && steps.trim-dependencies.outcome == 'success'
            && steps.cache-libs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.SHORT_WORKSPACE }}\build\tmp\Libraries
            ${{ env.SHORT_WORKSPACE }}\build\tmp\ThirdParty
          key: ${{ steps.cache-libs.outputs.cache-primary-key }}

      # 仅在当前世代已安全入库（或精确命中）后清理同前缀旧世代，防止两代叠加挤爆配额
      - name: Prune old cache generations.
        if: >-
          steps.cache-libs.outputs.cache-hit == 'true'
            || steps.save-libs.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_KEY: ${{ steps.cache-libs.outputs.cache-primary-key }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/caches?per_page=100" \
            --jq '.actions_caches[] | select(.key | startswith(env.CACHE_KEY_PREFIX)) | select(.key != env.CURRENT_KEY) | .id' \
            | while read -r id; do
                test -z "$id" && continue
                echo "deleting stale cache id $id"
                gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/caches/$id" || true
              done

      # build.py 读取 AYUGRAM_CCACHE 接入编译器；packer.cpp 自带 ccache:disable，私钥不进缓存
      - name: Install ccache.
        shell: bash
        run: |
          set -euo pipefail
          temp=$(cygpath -u "$RUNNER_TEMP")
          curl -fsSLo "$temp/ccache.zip" "$CCACHE_URL/$CCACHE_PACKAGE.zip"
          echo "$CCACHE_SHA256  $temp/ccache.zip" | sha256sum -c -
          python -m zipfile -e "$temp/ccache.zip" "$temp"
          echo "AYUGRAM_CCACHE=$(cygpath -w "$temp/$CCACHE_PACKAGE/ccache.exe")" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$(cygpath -w "$temp/ccache-data")" >> "$GITHUB_ENV"

      # 放在依赖缓存之后恢复：依赖缓存换代时配额超限，先被淘汰的是编译缓存
      - name: Restore compiler cache.
        id: cache-ccache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.CCACHE_KEY_PREFIX }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ env.CCACHE_KEY_PREFIX }}

      # Packer 是 Telegram 的构建依赖，私钥头文件必须在编译前就位
      - name: Write packer signing key.
        shell: bash
        working-directory: ${{ env.SHORT_WORKSPACE }}
        env:
          PACKER_PRIVATE_H: ${{ secrets.PACKER_PRIVATE_H }}
        run: |
          set -euo pipefail
          test -n "$PACKER_PRIVATE_H"
          printf '%s' "$PACKER_PRIVATE_H" > Telegram/SourceFiles/_other/packer_private.h

      - name: Build AyuGram Desktop.
        shell: cmd
        working-directory: ${{ env.SHORT_WORKSPACE }}
        run: |
          "%AYUGRAM_CCACHE%" -z || exit /b 1
          python scripts/build.py --jobs %BUILD_JOBS% --pack --clean-pack

      - name: Count ccache misses.
        id: ccache-stats
        shell: bash
        run: |
          set -euo pipefail
          ccache=$(cygpath -u "$AYUGRAM_CCACHE")
          "$ccache" --show-stats
          misses=$("$ccache" --print-stats | tr -d '\r' | sed -n 's/^cache_miss\t//p' | head -1)
          case "$misses" in (*[!0-9]*|'') misses=0;; esac
          echo "misses=$misses" >> "$GITHUB_OUTPUT"

      # 先删旧世代再入库，两代编译缓存叠加会把依赖缓存挤出配额
      - name: Prune old compiler caches.
        if: fromJSON(steps.ccache-stats.outputs.misses) > 300
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/caches?per_page=100" \
            --jq '.actions_caches[] | select(.key | startswith(env.CCACHE_KEY_PREFIX)) | .id' \
            | while read -r id; do
                test -z "$id" && continue
                echo "deleting stale compiler cache id $id"
                gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/caches/$id" || true
              done

      - name: Save compiler cache.
        if: fromJSON(steps.ccache-stats.outputs.misses) > 300
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.cache-ccache.outputs.cache-primary-key }}

      - name: Check release output.
        shell: bash
        working-directory: ${{ env.SHORT_WORKSPACE }}
        run: |
          set -euo pipefail
          artifact=$(ls build/AyuGram-v*-win-x64.zip | head -1)
          test -n "$artifact"
          size=$(stat -c %s "$artifact")
          echo "File size of ${artifact}: ${size} Bytes."

      - name: Pack update.
        shell: bash
        working-directory: ${{ env.SHORT_WORKSPACE }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^AppUpdateVersion  *//p' Telegram/build/version)
          test -n "$version"
          packer=$(pwd)/build/tmp/out/Release/Packer.exe
          test -f "$packer"
          cd build/AyuGram-v*-win-x64-release
          "$packer" -target win64 -version "$version" \
            -path AyuGram.exe -path Updater.exe
          mv "tx64upd${version}" ../
          ls -l "../tx64upd${version}"

      - name: Write artifact provenance.
        shell: bash
        working-directory: ${{ env.SHORT_WORKSPACE }}
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_REF: ${{ inputs.source_ref }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          VERSION: ${{ inputs.version }}
          APP_UPDATE_VERSION: ${{ inputs.appupdateversion }}
        run: |
          set -euo pipefail
          archive=$(ls build/AyuGram-v*-win-x64.zip)
          update="build/tx64upd${APP_UPDATE_VERSION}"
          python scripts/build_provenance.py write-artifact-manifest \
            --platform windows \
            --arch x64 \
            --source-repository Kindness-Kismet/AyuGramDesktop-Plus \
            --source-ref "$SOURCE_REF" \
            --source-sha "$SOURCE_SHA" \
            --source-run-id "$SOURCE_RUN_ID" \
            --source-run-attempt "$SOURCE_RUN_ATTEMPT" \
            --builder-repository "$GITHUB_REPOSITORY" \
            --builder-run-id "$GITHUB_RUN_ID" \
            --builder-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --version "$VERSION" \
            --appupdateversion "$APP_UPDATE_VERSION" \
            --output "build/provenance-windows-x64.json" \
            --file "$archive" \
            --file "$update"

      - name: Upload artifact.
        uses: actions/upload-artifact@v7
        with:
          name: AyuGram-Windows-x64
          path: |
            ${{ env.SHORT_WORKSPACE }}\build\AyuGram-v*-win-x64.zip
            ${{ env.SHORT_WORKSPACE }}\build\tx64upd*
            ${{ env.SHORT_WORKSPACE }}\build\provenance-windows-x64.json
          retention-days: 7

      - name: Remove packer signing key.
        if: always()
        shell: bash
        working-directory: ${{ env.SHORT_WORKSPACE }}
        run: rm -f Telegram/SourceFiles/_other/packer_private.h
